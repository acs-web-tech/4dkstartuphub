# ══════════════════════════════════════════════════════════════════
# ── Load Balancing: Backend Server Pool ────────────────────────
# ══════════════════════════════════════════════════════════════════
#
# HOW TO ADD NEW BACKEND SERVERS:
# ─────────────────────────────────────────────────────────────────
#   1. Deploy the Node.js app on the new server (same codebase, same env).
#   2. Ensure the new server can reach the same MongoDB and Redis instances.
#   3. Uncomment (or add) a 'server' line below with the new server's
#      IP address and port, e.g.:  server 10.0.0.2:5000;
#   4. Optionally set weights:    server 10.0.0.2:5000 weight=3;
#   5. Test config:               sudo nginx -t
#   6. Reload:                    sudo nginx -s reload
#
# IMPORTANT NOTES:
#   • ip_hash is REQUIRED for Socket.IO — it pins a client IP to one
#     backend so WebSocket upgrades always reach the same process.
#   • If you switch to multiple servers, configure a shared session
#     store (Redis) so JWT refresh and Socket.IO work across nodes.
#   • 'max_fails' and 'fail_timeout' enable automatic health checks;
#     Nginx will stop sending traffic to a downed server and retry
#     after the timeout expires.
# ─────────────────────────────────────────────────────────────────
upstream backend {
    # Sticky sessions — required for Socket.IO WebSocket connections.
    # All requests from the same client IP go to the same backend.
    ip_hash;

    # ── Primary server (current) ──────────────────────────────────
    server localhost:5000  max_fails=3  fail_timeout=30s;

    # ── Future servers (uncomment after purchasing & deploying) ────
    # server <SERVER_2_IP>:5000  max_fails=3  fail_timeout=30s;
    # server <SERVER_3_IP>:5000  max_fails=3  fail_timeout=30s;
    # server <SERVER_4_IP>:5000  max_fails=3  fail_timeout=30s  backup;

    # ── Keepalive connections to backends for better performance ──
    keepalive 32;
}

# ── Denial of Service Protections ──────────────────────────────
# Limit concurrent connections from a single IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Rate Limiting Zones ───────────────────────────────────────
# API limit: Increased to 100 requests/second with a massive 500 burst for heavy initial loads
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;

# Auth limit: Increased to 60 requests/minute (1 per sec) with a 100 burst
limit_req_zone $binary_remote_addr zone=auth_limit:20m rate=60r/m;

# Upload limit: Increased to 60 requests/minute with a 100 burst
limit_req_zone $binary_remote_addr zone=upload_limit:20m rate=60r/m;

# Meta preview limit: Prevent scraping/DoS on link preview generation
limit_req_zone $binary_remote_addr zone=meta_limit:10m rate=10r/m;

# Socket handshake limit: Prevent connection churn (rapidly opening/closing sockets)
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=5r/s;



# OTP limit: Restricted to 1 request per minute (Nginx does not support r/d)
# Note: Application-level logic enforces a stricter 15 OTPs per day limit.
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=1r/m;

# ── HTTP Server (Port 80) ─────────────────────────────────────
# Serves ACME challenge for Certbot, then redirects everything else to HTTPS
server {
    listen 80;
    server_name startup.4dk.in;

    # Let's Encrypt certificate verification
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (Port 443) ───────────────────────────────────
server {
    listen 443 ssl;
    server_name startup.4dk.in;

    # SSL Certificate paths (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/startup.4dk.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/startup.4dk.in/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_CUSTOM:10m;
    ssl_session_timeout 10m;

    # ── Slowloris & DoS Timeout Protections ──
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ── Connection Limit: Increased to 100 concurrent connections ──
    limit_conn conn_limit 100;

    # ── Buffer Limits for DoS Protection ──
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # HSTS - force browsers to use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root directory for static files (the React build)
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Disable cache for service worker to ensure prompt updates
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Drop Suspicious Bot Traffic Immediately (Saves CPU) ──
    location ~* \.(php|sql|env|zip|tar\.gz|bak|config)$ {
        return 444; # Drop connection instantly without HTTP response
    }

    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.git) {
        return 444; # Drop connection instantly without HTTP response
    }

    # Handle SPA routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Authentication API requests 
    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=100 nodelay;

        proxy_pass http://backend/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strict OTP limits
    location /api/auth/send-verification-otp {
        limit_req zone=otp_limit burst=5 nodelay;
        proxy_pass http://backend/api/auth/send-verification-otp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/forgot-password-otp {
        limit_req zone=otp_limit burst=5 nodelay;
        proxy_pass http://backend/api/auth/forgot-password-otp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/meta/preview {
        limit_req zone=meta_limit burst=5 nodelay;
        proxy_pass http://backend/api/meta/preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/upload {
        limit_req zone=upload_limit burst=100 nodelay;

        proxy_pass http://backend/api/upload;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase upload limit to 50MB
        client_max_body_size 50M;
    }

    # Proxy API requests to the Node.js backend running on localhost:5000
    location ^~ /api/ {
        limit_req zone=api_limit burst=500 nodelay;

        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase upload limit to 50MB
        client_max_body_size 50M;
    }

    # Proxy Socket.io requests to localhost:5000
    location ^~ /socket.io/ {
        # Limit connection handshakes to prevent churn attacks
        limit_req zone=ws_limit burst=20 nodelay;

        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Add longer timeouts for stable connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
